; 合宙 CORE-ESP32C3 核心板（AirM2M CORE ESP32C3），21mm x 51mm，板载 4MB SPI Flash
; 官方说明：https://wiki-zh.luatos.org/chips/esp32c3/board.html
;
; 这块板子用 board = airm2m_core_esp32c3 才是对的，它替你做了三件事：
;   1) LED_BUILTIN = GPIO12 (D4)、LED_BUILTIN_AUX = GPIO13 (D5)
;   2) flash_mode = dio —— GPIO12/13 只有在 DIO 模式下才能当普通 IO 用
;   3) flash_size = 4MB，并把 TX/RX/SDA/SCL 等命名对上这块板子的排针

[env:airm2m_core_esp32c3]
platform = espressif32
board = airm2m_core_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder

; 标准 JSON 库（不重复造轮子）
lib_deps = bblanchon/ArduinoJson@^7.2.1

; WiFi + BLE 同时编进来时，默认分区表只有 1.25MB 程序区，实测会到 106% 直接链接失败；
; huge_app 把程序区扩到约 3MB（代价是没有 OTA 双分区，本地烧录不受影响）。
; 只做闪灯这种小程序时这行可以不留，留着也没坏处。
board_build.partitions = huge_app.csv

; 你的板子是「经典版」：板载 CH343  USB转TTL 芯片接在 UART0 上，
; 插上 Type-C 后日志直接从串口(COM3 @115200)看，所以下面这行保持注释。
;
; 若换成「USB 直连版」（芯片原生 USB，没有 CH343），打开下面这行即可让
; Serial 走 USB 虚拟串口，代码里已经同时兼容两种接法：
; build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
